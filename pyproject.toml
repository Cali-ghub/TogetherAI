[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-together"
version = "0.1.0"
description = "A narrow shared-space client for Hermes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pillow>=10,<12",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "httpx2>=2.0,<3"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
